name: release-apk

# 只有真正影响 APK 的改动才触发。改 README 不该产出一个新版本。
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'watch/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 仓库是在 Windows 上建的，gradlew 的可执行位不一定进了 git
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 必须用和本地同一把钥匙。runner 自带的 debug keystore 是另一把，
      # 用它签出来的包装不到已经装了本地构建的表上。
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 DEBUG_KEYSTORE_BASE64 secret"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/debug.keystore
          echo "WW_KEYSTORE=$GITHUB_WORKSPACE/keystore/debug.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:test :watch:testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          WW_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :watch:assembleRelease --stacktrace

      # 指纹对不上说明 Secret 传错了。没有这一步的话，
      # 发布出去的会是一堆看起来正常、实际装不上的包。
      - name: Verify signing key fingerprint
        env:
          EXPECTED: 2F95A342B0EC6605C61E4DDF74D73410715055CC8748F3BE5B2353764D722577
        run: |
          APK=watch/build/outputs/apk/release/watch-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          FP=$("$BT/apksigner" verify --print-certs "$APK" \
                | grep -i 'SHA-256 digest' | head -1 \
                | grep -oiE '[0-9a-f]{64}' | tr '[:lower:]' '[:upper:]')
          echo "signer SHA-256: $FP"
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::签名指纹与预期不符，产出的 APK 无法覆盖安装"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          cp watch/build/outputs/apk/release/watch-release.apk "dist/weatherwatch-$TAG.apk"
          gh release create "$TAG" "dist/weatherwatch-$TAG.apk" \
            --title "$TAG" \
            --notes "提交 $SHA · 用调试密钥签名，可直接覆盖安装上一版：adb install -r weatherwatch-$TAG.apk"
